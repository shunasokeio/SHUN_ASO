<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data from accelerometer</title>
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <style>
    body {
      margin: 1.25rem;
      background: #fff;
      color: #111;
      font: 18px/1.5 sans-serif;
    }
    button {
      font: inherit;
      margin-right: 0.4rem;
    }
  </style>
</head>
<body>
  <h1>Data from accelerometer</h1>
  <button onclick="requestMotionPermission();">Get permission and start sensing</button>
  <button onclick="stopDeviceMotion();">Stop</button>

  <h2>Acceleration</h2>
  <p>X: <span id="accel-x">0.00</span></p>
  <p>Y: <span id="accel-y">0.00</span></p>
  <p>Z: <span id="accel-z">0.00</span></p>
  <p>Magnitude: <span id="accel-mag">0.00</span> m/s²</p>

  <h2>Activity breakpoint</h2>
  <p>Holding the phone still stays under <strong>3.00 m/s²</strong>. A quick move or shake that reaches that boundary triggers an alert.</p>

  <script type="text/javascript">
    alert("Welcome to sample page 1!");

    // Function to get sensor access permission from the browser
    function requestMotionPermission() {
      if (DeviceMotionEvent &&
          typeof DeviceMotionEvent.requestPermission === "function") {
        // iOS 13+ の Safari
        // 許可を取得
        DeviceMotionEvent.requestPermission().then(permissionState => {
          if (permissionState === "granted") {
            // 許可を得られた場合、devicemotionをイベントリスナーに追加
            window.addEventListener("devicemotion", handleAcceleration, false);
          } else {
            // 許可を得られなかった場合の処理
            console.log("Permission not granted!");
            alert("Permission not granted!");
          }
        }).catch(console.error); // https通信でない場合などで許可を取得できなかった場合
      } else {
        // For other devices
        console.log("detected other device. so adding listener...");
        window.addEventListener("devicemotion", handleAcceleration, false);
      }
    }

    function stopDeviceMotion() {
      window.removeEventListener("devicemotion", handleAcceleration, false);
    }

    // Function(1): to handle acceleration data
    // - This function will be called about 10-50 times per second
    // Boundary between "phone is still" and "phone is being moved".
    // acceleration excludes gravity, so a resting phone stays near 0.
    const ACTIVITY_BREAKPOINT = 3;

    let aboveBreakpoint = false;

    function formatAccel(value) {
      return value == null ? "0.00" : Number(value).toFixed(2);
    }

    function handleAcceleration(aevent) {
      const accel = aevent.acceleration || {};
      const x = accel.x;
      const y = accel.y;
      const z = accel.z;
      $("#accel-x").text(formatAccel(x));
      $("#accel-y").text(formatAccel(y));
      $("#accel-z").text(formatAccel(z));

      if (x == null || y == null || z == null) {
        return;
      }

      const magnitude = Math.sqrt(x * x + y * y + z * z);
      $("#accel-mag").text(formatAccel(magnitude));

      if (magnitude >= ACTIVITY_BREAKPOINT && !aboveBreakpoint) {
        aboveBreakpoint = true;
        alert(
          "Activity breakpoint crossed: " +
          magnitude.toFixed(2) +
          " m/s² (boundary " +
          ACTIVITY_BREAKPOINT.toFixed(2) +
          " m/s²)."
        );
      } else if (magnitude < ACTIVITY_BREAKPOINT) {
        aboveBreakpoint = false;
      }
    }
  </script>
</body>
</html>
